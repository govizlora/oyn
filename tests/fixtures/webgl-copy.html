<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Oyn WebGL2 copy benchmark</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eee9e3;
        color: #534e47;
        font: 13px system-ui;
      }
      header {
        height: 88px;
        padding: 20px 32px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      #scene {
        position: relative;
        margin: 0 32px;
      }
      .card {
        position: absolute;
        width: 120px;
        height: 80px;
      }
      canvas {
        position: absolute;
        pointer-events: none;
      }
      .label {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
      }
      .label small {
        margin-top: 5px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>20 raised + 20 inset · Ceramic</h1>
      <div>Same WGSL optics · 40 animated surfaces · 120 × 80 CSS px</div>
    </header>
    <main id="scene"></main>
    <script type="module" src="./webgl-copy.ts"></script>
  </body>
</html>
