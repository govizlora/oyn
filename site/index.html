<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="OYN is a work-in-progress UI library exploring material, light, and depth. Play a small ceramic instrument."
    />
    <title>OYN — UI you can feel.</title>
    <link rel="icon" href="../artifacts/brand/oyn-logo.svg" />
    <link rel="stylesheet" href="./site.css" />
  </head>
  <body>
    <header>
      <img class="wordmark" src="../artifacts/brand/oyn-logo.svg" alt="OYN" />
      <nav aria-label="Project links">
        <a href="https://github.com/govizlora/oyn">GitHub</a
        ><a href="https://x.com/Govizlora">X</a>
      </nav>
    </header>
    <main>
      <section aria-labelledby="headline">
        <p class="status">Work in progress</p>
        <h1 id="headline">UI you<br />can feel.</h1>
        <p class="intro">
          An experimental UI library shaped by material, light, and depth.
        </p>
      </section>
      <figure>
        <div id="instrument">
          <noscript>Enable JavaScript to play the ceramic keys.</noscript>
        </div>
        <figcaption>
          <strong>Ceramic keys</strong><span>Press a key to play a note.</span>
        </figcaption>
      </figure>
    </main>
    <footer>OYN <span aria-hidden="true">/</span> Interaction studies</footer>
    <script type="module" src="./instrument.tsx"></script>
  </body>
</html>
